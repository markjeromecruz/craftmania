<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sandyten</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💎</text></svg>" />
  <style>
    :root {
      --ink: #0d1b2a;
      --glow: #7fd1ff;
      --accent: #ffd166;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: #eaf4ff;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- Loading screen ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 35%, #16314d 0%, #08111d 60%, #05070d 100%);
    }
    #loader .title {
      font-size: clamp(38px, 9vw, 86px);
      font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(120deg, var(--glow), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0;
    }
    #loader .sub { font-size: 15px; opacity: 0; color: #9fc4e6; letter-spacing: 3px; text-transform: uppercase; }
    .bar { width: min(280px, 70vw); height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--glow), var(--accent)); }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; }
    #hud .topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(5,7,13,.55), transparent);
    }
    #hud .brand { font-weight: 800; letter-spacing: 1px; font-size: 18px; }
    #hud .brand span { color: var(--accent); }
    #hud .pill {
      pointer-events: auto;
      background: rgba(13,27,42,.6); border: 1px solid rgba(127,209,255,.25);
      padding: 7px 13px; border-radius: 99px; font-size: 13px; backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    /* on phones the 9 pills can't fit one row — wrap them instead of crushing/clipping */
    #hud .topbar > div:last-child { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; min-width: 0; }
    @media (pointer: coarse) {
      #hud .pill { min-height: 40px; display: inline-flex; align-items: center; }
      /* early readers: bump the instructional text that tells a kid what to do next */
      #hud .pill, #hud .hint, .shop-sub, .lock-label { font-size: 15px; }
    }
    @media (max-width: 520px) {
      #hud .topbar { padding: 8px 10px; }
      #hud .pill { padding: 7px 10px; }
      #fps { display: none; } /* debug readout, not a kid-facing control */
    }
    #hud .hint {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      font-size: 13px; color: #b9d6f0; background: rgba(13,27,42,.5);
      padding: 8px 16px; border-radius: 99px; border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px); text-align: center;
    }
    a.notch { color: var(--glow); text-decoration: none; }

    /* ---------- Character speech bubble ---------- */
    .speech {
      position: fixed; z-index: 30; pointer-events: none;
      transform: translate(-50%, -100%);
      background: #ffffff; color: #14233a;
      font-weight: 600; font-size: 15px; line-height: 1.25;
      padding: 9px 14px; border-radius: 16px;
      max-width: 220px; text-align: center;
      border: 2px solid var(--accent);
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
    }
    .speech::after {
      content: ''; position: absolute; left: 50%; top: 100%;
      transform: translateX(-50%);
      border: 9px solid transparent; border-top-color: #ffffff;
    }
    .speech .who {
      display: block; font-size: 11px; letter-spacing: .5px;
      text-transform: uppercase; color: #8aa0bd; margin-bottom: 2px;
    }

    /* ---------- Character picker ---------- */
    #picker, .modal-overlay {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center;
      background: rgba(8, 17, 29, .78); backdrop-filter: blur(8px);
    }
    /* on touch, keep modals near the top so the on-screen keyboard never covers their buttons */
    body.touch .modal-overlay { align-items: flex-start; padding-top: max(24px, env(safe-area-inset-top)); }
    .picker-card .emoji-icon { font-size: 52px; line-height: 1; }
    @media (max-width: 520px) { .picker-card .emoji-icon { font-size: 40px; } }
    .picker-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .name-input {
      display: block; width: 100%; box-sizing: border-box; margin: 4px 0 18px;
      font: inherit; font-weight: 700; font-size: 20px; text-align: center; color: #eaf4ff;
      padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .08);
      border: 2px solid rgba(127, 209, 255, .4); outline: none;
    }
    .name-input:focus { border-color: var(--accent); background: rgba(127, 209, 255, .16); }
    .picker-panel {
      position: relative; /* anchors the ✕ close button */
      background: linear-gradient(180deg, #16314d, #0c1d30);
      border: 1px solid rgba(127, 209, 255, .25); border-radius: 22px;
      padding: 24px 26px; max-width: 680px; width: 92%;
      max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    }
    .picker-panel h2 { text-align: center; font-size: 24px; margin-bottom: 16px; }
    .picker-panel h2 span { color: var(--accent); }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .picker-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; color: #eaf4ff; font: inherit; font-weight: 700; font-size: 15px;
      background: rgba(255, 255, 255, .06); border: 2px solid transparent;
      border-radius: 16px; padding: 12px 8px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .picker-card img { width: 96px; height: 96px; object-fit: contain; pointer-events: none; }
    .picker-card.locked img { filter: grayscale(1) brightness(.5); }
    .picker-card.locked { border-color: rgba(255,255,255,.12); }
    .picker-card .lock-badge {
      position: absolute; top: 6px; right: 6px; font-size: 20px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
    }
    .picker-card.locked .lock-label { color: #cdd6e0; font-size: 13px; font-weight: 700; }
    /* only apply the hover lift on devices that actually have hover (mouse) —
       otherwise a tap on touch leaves the card permanently "stuck" lifted */
    @media (hover: hover) {
      .picker-card:hover { transform: translateY(-4px); border-color: var(--accent); background: rgba(255, 255, 255, .12); }
    }
    .picker-card:focus { border-color: var(--accent); background: rgba(255, 255, 255, .12); outline: none; }
    .picker-card:active { transform: translateY(-2px); border-color: var(--accent); background: rgba(255, 255, 255, .14); }
    @media (max-width: 520px) {
      .picker-panel { padding: 16px 14px; max-height: 90vh; }
      .picker-panel h2 { font-size: 19px; margin-bottom: 10px; }
      .picker-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .picker-card { padding: 8px 4px; font-size: 14px; }
      .picker-card img { width: 78px; height: 78px; }
    }

    /* ---------- Start menu (New Game / Continue) ---------- */
    #startmenu {
      position: fixed; inset: 0; z-index: 45; display: none;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, #16314d 0%, #08111d 65%, #05070d 100%);
    }
    .start-panel { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px; }
    .start-panel h1 {
      font-size: clamp(44px, 10vw, 92px); font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(120deg, var(--glow), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0;
    }
    .start-panel p { color: #9fc4e6; font-size: 15px; margin-bottom: 14px; }
    .start-btn {
      width: 280px; max-width: 80vw; cursor: pointer; font: inherit; font-weight: 700; font-size: 20px;
      color: #eaf4ff; padding: 16px; border-radius: 16px;
      background: rgba(255, 255, 255, .08); border: 2px solid rgba(127, 209, 255, .4);
      transition: transform .1s ease, background .12s ease, border-color .12s ease;
    }
    .start-btn:hover { transform: translateY(-3px); background: rgba(127, 209, 255, .22); border-color: var(--accent); }
    .start-btn.disabled { opacity: .4; cursor: default; transform: none; background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.15); }

    /* ---------- Shop panel ---------- */
    #shop {
      position: fixed; z-index: 35; right: 18px; top: 50%;
      transform: translateY(-50%); width: 280px; max-width: 86vw; display: none;
      background: linear-gradient(180deg, #16314d, #0c1d30);
      border: 1px solid rgba(127, 209, 255, .25); border-radius: 18px;
      padding: 16px 16px 14px; box-shadow: 0 16px 44px rgba(0, 0, 0, .5);
    }
    #shop h3 { text-align: center; font-size: 20px; margin-bottom: 2px; }
    #shop .shop-sub { text-align: center; font-size: 12px; color: #ffd166; margin-bottom: 12px; }
    .shop-list { display: flex; flex-direction: column; gap: 7px; }
    .shop-item {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; cursor: pointer; color: #eaf4ff; font: inherit; font-weight: 600; font-size: 15px;
      background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 11px; padding: 9px 12px; transition: transform .1s, background .1s;
    }
    .shop-item:hover { background: rgba(255, 255, 255, .14); transform: translateX(-3px); }
    .shop-item .shop-price { color: #ffd166; font-weight: 700; white-space: nowrap; }
    .shop-item.cant-afford { opacity: .45; }
    .shop-msg { min-height: 18px; text-align: center; font-size: 13px; color: #9be6a6; margin-top: 10px; font-weight: 600; }
    .shop-owned { text-align: center; font-size: 16px; margin-top: 4px; }
    .shop-item.worn { border-color: var(--accent); background: rgba(255, 209, 102, .16); }

    /* ---------- Dressing room panel (left side) ---------- */
    #dressroom {
      position: fixed; z-index: 35; left: 18px; top: 50%;
      transform: translateY(-50%); width: 290px; max-width: 86vw; display: none;
      max-height: 88vh; overflow-y: auto;
      background: linear-gradient(180deg, #3a2150, #1d1030);
      border: 1px solid rgba(231, 198, 224, .3); border-radius: 18px;
      padding: 16px 16px 14px; box-shadow: 0 16px 44px rgba(0, 0, 0, .5);
    }
    #dressroom h3 { text-align: center; font-size: 19px; margin-bottom: 2px; }
    #dressroom .shop-sub { color: #f0c6e8; }

    /* ---------- Trading panel (right side, above the shop spot) ---------- */
    #tradepanel {
      position: fixed; z-index: 35; right: 18px; top: 16px;
      width: 250px; max-width: 80vw; display: none; max-height: 80vh; overflow-y: auto;
      background: linear-gradient(180deg, #163d2f, #0c2018);
      border: 1px solid rgba(127, 255, 209, .25); border-radius: 18px;
      padding: 14px 14px 12px; box-shadow: 0 16px 44px rgba(0, 0, 0, .5);
    }
    #tradepanel h3 { text-align: center; font-size: 18px; margin-bottom: 2px; }
    #tradepanel .shop-sub { color: #9be6c0; }
    .dress-entry { display: flex; flex-direction: column; gap: 5px; }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 4px 6px; }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer; padding: 0;
      border: 2px solid rgba(255, 255, 255, .35); transition: transform .1s;
    }
    .swatch:hover { transform: scale(1.18); }
    .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

    /* ---------- Quests ---------- */
    #questpanel {
      position: fixed; z-index: 35; right: 18px; top: 16px;
      width: 260px; max-width: 80vw; display: none; max-height: 80vh; overflow-y: auto;
      background: linear-gradient(180deg, #2d2350, #15102b);
      border: 1px solid rgba(186, 160, 255, .3); border-radius: 18px;
      padding: 14px 14px 12px; box-shadow: 0 16px 44px rgba(0, 0, 0, .5);
    }
    #questpanel h3 { text-align: center; font-size: 18px; margin-bottom: 2px; }
    #questpanel .shop-sub { color: #cdbcff; }
    #questpanel .shop-item.worn { opacity: .6; }
    /* prize panel — reuses shop styles, teal accent */
    #prizepanel {
      position: fixed; z-index: 35; right: 18px; top: 16px;
      width: 270px; max-width: 80vw; display: none; max-height: 80vh; overflow-y: auto;
      background: linear-gradient(180deg, #143c36, #0c2018);
      border: 1px solid rgba(127, 255, 209, .3); border-radius: 18px;
      padding: 14px 14px 12px; box-shadow: 0 16px 44px rgba(0, 0, 0, .5);
    }
    #prizepanel h3 { text-align: center; font-size: 18px; margin-bottom: 2px; }
    #prizepanel .shop-sub { color: #9be6c0; text-align: center; }
    #prizepanel .shop-item.worn { opacity: .6; }
    /* every side panel gets a ✕ so kids can always close it */
    .panel-close {
      position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; color: #fff; font-weight: 700; font-size: 14px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    }
    /* keep scrolling panels clear of the touch joystick (bottom-left) */
    @media (hover: none) and (pointer: coarse) {
      #dressroom { top: 12px; transform: none; max-height: calc(100vh - 196px); }
      #questpanel, #prizepanel, #tradepanel { max-height: calc(100vh - 196px); }
      .swatch { width: 34px; height: 34px; }
      .swatches { gap: 8px; }
    }
    body.touch #dressroom { top: 12px; transform: none; max-height: calc(100vh - 196px); }
    /* on phones, drop the panels below the (wrapped, up-to-3-row) top bar so its
       buttons stay tappable, and stop above the joystick (declared after the
       coarse-pointer rules so this tighter cap wins on portrait phones) */
    @media (max-width: 520px) {
      #questpanel, #prizepanel, #tradepanel { top: 136px; max-height: calc(100vh - 300px); }
    }
    button.shop-price { font: inherit; font-size: 14px; padding: 8px 12px; min-height: 40px; }
    /* battle prompt (small bar above the controls) */
    #battleprompt {
      position: fixed; z-index: 55; left: 50%; transform: translateX(-50%); bottom: 86px;
      display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; color: #fff;
      background: linear-gradient(180deg, #3a1f2a, #221016); border: 1px solid rgba(255,140,160,.5);
      box-shadow: 0 12px 32px rgba(0,0,0,.5); font-weight: 600;
      max-width: 94vw; flex-wrap: wrap; justify-content: center;
    }
    /* on touch, sit above the joystick instead of on top of it */
    @media (hover: none) and (pointer: coarse) { #battleprompt { bottom: 170px; } #hud .hint { bottom: 170px; } }
    body.touch #battleprompt { bottom: 170px; }
    body.touch #hud .hint { bottom: 170px; } /* the how-to-play hint clears the joystick too */
    .bp-btn { padding: 8px 14px; border-radius: 12px; cursor: pointer; color: #fff; font-weight: 700;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
    .bp-btn.fight { background: #e0556a; border-color: #ff8a9a; }
    /* battle modal */
    .battle-name { text-align: center; font-weight: 700; margin: 8px 0 4px; }
    .battle-sprite { width: 120px; height: 120px; object-fit: contain; display: block; margin: 4px auto; }
    .hpbar { height: 14px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; margin: 0 6px; }
    .hpfill { height: 100%; width: 100%; background: linear-gradient(90deg,#74e08c,#4faf54); transition: width .25s; }
    .hpfill.enemy { background: linear-gradient(90deg,#ff7a7a,#e0556a); }
    #questtoast {
      position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); top: 64px;
      display: none; padding: 10px 18px; border-radius: 16px; font-weight: 700; color: #fff;
      background: linear-gradient(180deg, #3a2d6b, #20183f);
      border: 1px solid rgba(186, 160, 255, .45); box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    }
    #puzzle {
      position: fixed; inset: 0; z-index: 70; display: none;
      align-items: center; justify-content: center; background: rgba(8, 10, 22, .55);
      backdrop-filter: blur(3px);
    }
    .puzzle-panel {
      width: 320px; max-width: 86vw; text-align: center; padding: 20px;
      background: linear-gradient(180deg, #2d2350, #15102b);
      border: 1px solid rgba(186, 160, 255, .35); border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    }
    .puzzle-msg { color: #cdbcff; margin: 6px 0 14px; min-height: 20px; }
    .puzzle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .puzzle-pad {
      height: 92px; border-radius: 18px; border: 3px solid rgba(255,255,255,.25);
      cursor: pointer; opacity: .55; transition: opacity .12s, transform .12s;
    }
    .puzzle-pad:hover { transform: scale(1.03); }
    .puzzle-pad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 24px rgba(255,255,255,.7); }
    .puzzle-close {
      margin-top: 16px; padding: 8px 20px; border-radius: 14px; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); font-weight: 600;
    }
    /* shared mini-game modal (Fruit Merge, Tetris) */
    .gamemodal {
      position: fixed; inset: 0; z-index: 70; display: none;
      align-items: center; justify-content: center; background: rgba(8, 10, 22, .55);
      backdrop-filter: blur(3px);
    }
    .merge-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      width: 264px; margin: 0 auto; aspect-ratio: 1;
    }
    .merge-cell {
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; border-radius: 12px; background: rgba(255,255,255,.04);
      aspect-ratio: 1; user-select: none;
    }
    .tet-canvas { display: block; margin: 0 auto; border-radius: 10px; background: rgba(255,255,255,.05); }
    .match-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      width: 264px; margin: 0 auto;
    }
    .match-card {
      aspect-ratio: 1; font-size: 28px; border-radius: 12px; cursor: pointer; color: #fff;
      background: rgba(186,160,255,.25); border: 1px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center; transition: transform .1s;
    }
    .match-card.up { background: rgba(255,255,255,.16); }
    .match-card:active { transform: scale(.95); }
    /* Block Blast! */
    .bb-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
      width: 288px; max-width: 80vw; margin: 0 auto; aspect-ratio: 1;
      background: rgba(255,255,255,.04); padding: 4px; border-radius: 10px;
    }
    .bb-cell { aspect-ratio: 1; border-radius: 5px; background: rgba(255,255,255,.06); cursor: pointer; }
    .bb-tray { display: flex; justify-content: center; gap: 14px; margin-top: 14px; min-height: 48px; align-items: center; }
    .bb-piece { padding: 6px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
    .bb-piece.sel { border-color: #fff; background: rgba(255,255,255,.14); }
    .bb-mini { display: grid; gap: 2px; }
    .bb-mcell { width: 13px; height: 13px; border-radius: 3px; }
    .dpad {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px;
    }
    .dpad-btn {
      padding: 12px 0; font-size: 20px; border-radius: 12px; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    }
    .dpad-btn:active { transform: scale(.94); background: rgba(255,255,255,.2); }

    /* ---------- Touch joystick (mobile only) ---------- */
    #joystick {
      position: fixed; left: 24px; bottom: 24px; z-index: 36;
      width: 132px; height: 132px; border-radius: 50%;
      background: rgba(13, 27, 42, .32); border: 2px solid rgba(255, 255, 255, .25);
      display: none; align-items: center; justify-content: center;
      touch-action: none; -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(4px);
    }
    #joyknob {
      width: 58px; height: 58px; border-radius: 50%; pointer-events: none;
      background: rgba(255, 255, 255, .5); border: 2px solid rgba(255, 255, 255, .85);
      transition: transform .04s linear;
    }
    /* show only on touch / coarse-pointer devices, or when JS flags touch */
    @media (hover: none) and (pointer: coarse) { #joystick { display: flex; } }
    body.touch #joystick { display: flex; }

    /* ---------- Throw ball button ---------- */
    #throwBtn {
      position: fixed; right: 24px; bottom: 30px; z-index: 36;
      width: 72px; height: 72px; border-radius: 50%; cursor: pointer;
      font-size: 34px; line-height: 1; padding: 0;
      background: rgba(13, 27, 42, .5); border: 2px solid rgba(255, 255, 255, .3);
      backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease, background .1s ease;
    }
    #throwBtn:hover { background: rgba(127, 209, 255, .3); }
    #throwBtn:active { transform: scale(.9); }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Loading screen (animated out by anime.js once the scene is ready) -->
  <div id="loader">
    <div class="title">Sandyten</div>
    <div class="sub">loading the world</div>
    <div class="bar"><i></i></div>
  </div>

  <!-- HUD overlay (faded in by anime.js) -->
