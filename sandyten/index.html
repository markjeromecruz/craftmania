<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sandyten</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💎</text></svg>" />
  <style>
    :root {
      --ink: #0d1b2a;
      --glow: #7fd1ff;
      --accent: #ffd166;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      color: #eaf4ff;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- Loading screen ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 35%, #16314d 0%, #08111d 60%, #05070d 100%);
    }
    #loader .title {
      font-size: clamp(38px, 9vw, 86px);
      font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(120deg, var(--glow), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0;
    }
    #loader .sub { font-size: 15px; opacity: 0; color: #9fc4e6; letter-spacing: 3px; text-transform: uppercase; }
    .bar { width: min(280px, 70vw); height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--glow), var(--accent)); }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; }
    #hud .topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(5,7,13,.55), transparent);
    }
    #hud .brand { font-weight: 800; letter-spacing: 1px; font-size: 18px; }
    #hud .brand span { color: var(--accent); }
    #hud .pill {
      pointer-events: auto;
      background: rgba(13,27,42,.6); border: 1px solid rgba(127,209,255,.25);
      padding: 7px 13px; border-radius: 99px; font-size: 13px; backdrop-filter: blur(6px);
    }
    #hud .hint {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      font-size: 13px; color: #b9d6f0; background: rgba(13,27,42,.5);
      padding: 8px 16px; border-radius: 99px; border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px); text-align: center;
    }
    a.notch { color: var(--glow); text-decoration: none; }

    /* ---------- Character speech bubble ---------- */
    .speech {
      position: fixed; z-index: 30; pointer-events: none;
      transform: translate(-50%, -100%);
      background: #ffffff; color: #14233a;
      font-weight: 600; font-size: 15px; line-height: 1.25;
      padding: 9px 14px; border-radius: 16px;
      max-width: 220px; text-align: center;
      border: 2px solid var(--accent);
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
    }
    .speech::after {
      content: ''; position: absolute; left: 50%; top: 100%;
      transform: translateX(-50%);
      border: 9px solid transparent; border-top-color: #ffffff;
    }
    .speech .who {
      display: block; font-size: 11px; letter-spacing: .5px;
      text-transform: uppercase; color: #8aa0bd; margin-bottom: 2px;
    }

    /* ---------- Character picker ---------- */
    #picker {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center;
      background: rgba(8, 17, 29, .78); backdrop-filter: blur(8px);
    }
    .picker-panel {
      background: linear-gradient(180deg, #16314d, #0c1d30);
      border: 1px solid rgba(127, 209, 255, .25); border-radius: 22px;
      padding: 24px 26px; max-width: 680px; width: 92%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    }
    .picker-panel h2 { text-align: center; font-size: 24px; margin-bottom: 16px; }
    .picker-panel h2 span { color: var(--accent); }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .picker-card {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; color: #eaf4ff; font: inherit; font-weight: 700; font-size: 15px;
      background: rgba(255, 255, 255, .06); border: 2px solid transparent;
      border-radius: 16px; padding: 12px 8px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .picker-card img { width: 96px; height: 96px; object-fit: contain; pointer-events: none; }
    .picker-card:hover, .picker-card:focus {
      transform: translateY(-4px); border-color: var(--accent);
      background: rgba(255, 255, 255, .12); outline: none;
    }
    @media (max-width: 520px) {
      .picker-grid { grid-template-columns: repeat(2, 1fr); }
      .picker-card img { width: 76px; height: 76px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Loading screen (animated out by anime.js once the scene is ready) -->
  <div id="loader">
    <div class="title">Sandyten</div>
    <div class="sub">loading the world</div>
    <div class="bar"><i></i></div>
  </div>

  <!-- HUD overlay (faded in by anime.js) -->
  <div id="hud">
    <div class="topbar">
      <div class="brand">Sandy<span>ten</span></div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="pill" id="changeBtn" style="display:none; cursor:pointer;">⟳ Change character</button>
        <div class="pill" id="score">⭐ 0</div>
        <div class="pill" id="fps">– fps</div>
      </div>
    </div>
    <div class="hint">Click a character to pick who you are!</div>
  </div>

  <!-- Local, vendored libraries — no internet / no build step required -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
      "three/examples/jsm/": "./vendor/three/addons/",
      "animejs": "./vendor/anime/anime.esm.js"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
